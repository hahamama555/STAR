
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101b3b">
<title>隠された場所を当てて！</title>

<style>
:root {
  color-scheme: dark;
  --navy: #101b3b;
  --gold: #f4c64e;
  --pink: #ff4e91;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: radial-gradient(
    circle at top,
    #294c91,
    #101b3b 58%,
    #080e20
  );
  font-family: -apple-system, BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
  color: #fff;
  padding: 14px 12px 28px;
}

main {
  max-width: 560px;
  margin: auto;
}

.title {
  text-align: center;
  font-weight: 900;
  font-size: clamp(25px, 7vw, 39px);
  line-height: 1.15;
  text-shadow: 0 3px 0 #7c3900,
    0 0 15px #ffd65b;
  margin: 6px 0;
}

.sub {
  text-align: center;
  color: #ffe58a;
  font-weight: 800;
  margin: 8px 0 14px;
}

.progress {
  background: #08142f;
  border: 2px solid var(--gold);
  border-radius: 15px;
  text-align: center;
  padding: 9px;
  font-size: clamp(23px, 6vw, 32px);
  font-weight: 900;
  margin: 12px 0;
}

.progress small {
  font-size: 13px;
  color: #ffe58a;
}

.stage {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  border: 4px solid var(--gold);
  border-radius: 14px;
  overflow: hidden;
  background: #17264b;
  box-shadow: 0 0 18px #f8c84a66;
}

.photo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.grid {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  grid-template-rows: repeat(7, 1fr);
  gap: 2px;
  padding: 2px;
}

.tile {
  border: 1px solid #fff3a0;
  border-radius: 5px;
  background: linear-gradient(
    145deg,
    #ffe887,
    #e7a91c 55%,
    #a95c08
  );
  box-shadow: inset 0 0 5px #fff8;
  display: grid;
  place-items: center;
  color: #fff8b0;
  font-size: clamp(18px, 5.6vw, 31px);
  font-weight: 900;
  text-shadow: 0 2px 2px #995500;
  touch-action: manipulation;
  padding: 0;
}

.tile.open {
  opacity: 0;
  pointer-events: none;
}

.hint {
  text-align: center;
  font-weight: 800;
  color: #fff2bd;
  margin: 10px 0 14px;
}

.panel {
  background: #14264c;
  border: 1px solid #6783bb;
  border-radius: 16px;
  padding: 12px;
  margin-top: 12px;
}

.panel h2 {
  font-size: 16px;
  margin: 0 0 10px;
  color: #ffdf72;
}

.buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.btn {
  border: 0;
  border-radius: 12px;
  padding: 13px 8px;
  font-size: 15px;
  font-weight: 900;
  color: #17203d;
  background: linear-gradient(#ffe58b, #e5a72b);
  touch-action: manipulation;
}

.btn.secondary {
  background: #f5f7ff;
  color: #18264b;
}

.btn.danger {
  background: #ff7b9e;
  color: #3b1020;
}

.btn:active {
  transform: scale(.98);
}

input[type=file] {
  width: 100%;
  font-size: 14px;
  color: #fff;
}

label {
  display: block;
  font-size: 13px;
  color: #dbe5ff;
  margin: 8px 0;
}

.note {
  font-size: 12px;
  color: #c5d2ef;
  line-height: 1.6;
  margin-top: 12px;
}

.status {
  text-align: center;
  font-size: 13px;
  color: #cbd8f5;
  margin-top: 8px;
}
</style>
</head>

<body>
<main>

<div class="title">
  隠された場所を当てて！
</div>

<div class="sub">
  ⭐ ギフトスター1個で1マスOPEN！ ⭐
</div>

<div class="progress">
  <span id="count">0</span> / 49 OPEN
  <br>
  <small>見えてきた景色から場所を予想してね！</small>
</div>

<div class="stage" id="stage">

  <img
    class="photo"
    id="photo"
    alt="出題する観光地の写真"
  >

  <div class="grid" id="grid"></div>

</div>

<div class="hint">
  星のマスをタップして開こう！
</div>

<section class="panel">

  <h2>📱 配信中の操作</h2>

  <div class="buttons">

    <button class="btn" id="next">
      ⭐ 次の1マスをOPEN
    </button>

    <button class="btn secondary" id="undo">
      ↩ 1マス戻す
    </button>

    <button class="btn danger" id="reset">
      ⟲ 全49マスを隠す
    </button>

    <button class="btn secondary" id="shuffle">
      🔀 ランダムに1マスOPEN
    </button>

  </div>

  <div class="status" id="status">
    準備OK・写真を選んでスタート！
  </div>

</section>

<section class="panel">

  <h2>🖼️ 出題する写真</h2>

  <label>
    iPhoneの写真から観光地・名所の画像を選択
  </label>

  <input
    id="upload"
    type="file"
    accept="image/*"
  >

  <div class="note">
    選んだ写真はこのiPhoneのブラウザ内で表示します。
    写真を変えると49マスが閉じます。
    配信前に写真をセットしておいてください。
  </div>

</section>

<div class="note">
  ※この試作版は手動操作です。
  ギフトスターの自動検知には別途TikTok LIVEの
  イベント連携が必要です。
  画面共有中は、このページの操作画面も配信に映ります。
</div>

</main>

<script>

const grid = document.getElementById("grid");
const count = document.getElementById("count");
const status = document.getElementById("status");

let opened = [];
const tiles = [];

// 49マスを作成
for (let i = 0; i < 49; i++) {

  const b = document.createElement("button");

  b.className = "tile";
  b.type = "button";
  b.textContent = "★";

  b.setAttribute(
    "aria-label",
    `${i + 1}番のマスを開く`
  );

  b.addEventListener("click", () => {
    openTile(i);
  });

  grid.appendChild(b);
  tiles.push(b);

}

// 画面更新
function update() {

  count.textContent = opened.length;

  if (opened.length === 49) {

    status.textContent =
      "全49マスOPEN！正解発表！";

  } else {

    status.textContent =
      `${opened.length}マスOPEN・残り${49 - opened.length}マス`;

  }

}

// 指定マスを開く
function openTile(i) {

  if (opened.includes(i)) return;

  opened.push(i);

  tiles[i].classList.add("open");

  update();

}

// 次のマスを開く
function openNext(random = false) {

  const left = tiles
    .map((_, i) => i)
    .filter(i => !opened.includes(i));

  if (!left.length) return;

  const i = random
    ? left[Math.floor(Math.random() * left.length)]
    : left[0];

  openTile(i);

}

// 次の1マス
document.getElementById("next").onclick = () => {
  openNext(false);
};

// ランダムOPEN
document.getElementById("shuffle").onclick = () => {
  openNext(true);
};

// 1マス戻す
document.getElementById("undo").onclick = () => {

  const i = opened.pop();

  if (i !== undefined) {
    tiles[i].classList.remove("open");
  }

  update();

};

// 全マスリセット
document.getElementById("reset").onclick = () => {

  opened = [];

  tiles.forEach(t => {
    t.classList.remove("open");
  });

  update();

};

// 写真を選択
document.getElementById("upload").onchange = e => {

  const f = e.target.files && e.target.files[0];

  if (!f) return;

  const url = URL.createObjectURL(f);

  document.getElementById("photo").src = url;

  opened = [];

  tiles.forEach(t => {
    t.classList.remove("open");
  });

  update();

  status.textContent =
    "写真をセットしました！配信を始められます。";

};

update();

</script>

</body>
</html>
