
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101b3b">
<title>誕生月×血液型</title>

<style>
:root {
  color-scheme: dark;
  --navy: #101b3b;
  --gold: #f4c64e;
  --pink: #ff4e91;
}

* {
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {
  background: radial-gradient(
    circle at top,
    #294c91,
    #101b3b 58%,
    #080e20
  );
  font-family: -apple-system, BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
  color: #fff;
  padding:
    max(5px, env(safe-area-inset-top))
    10px
    max(5px, env(safe-area-inset-bottom));
  min-height: 100vh;
  min-height: 100svh;
}

main {
  width: 100%;
  max-width: 560px;
  height: 100%;
  height: calc(
    100svh
    - max(5px, env(safe-area-inset-top))
    - max(5px, env(safe-area-inset-bottom))
  );
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: clamp(3px, .7svh, 7px);
  min-height: 0;
}

.title {
  text-align: center;
  font-weight: 900;
  font-size: clamp(20px, 5.8vw, 31px);
  line-height: 1.08;
  text-shadow: 0 2px 0 #7c3900, 0 0 10px #ffd65b;
  margin: 0;
  flex: 0 0 auto;
}

.sub {
  text-align: center;
  color: #ffe58a;
  font-weight: 800;
  font-size: clamp(11px, 3.2vw, 15px);
  line-height: 1.15;
  margin: 0;
  flex: 0 0 auto;
}

.progress {
  background: #08142f;
  border: 2px solid var(--gold);
  border-radius: 11px;
  text-align: center;
  padding: 4px 6px;
  font-size: clamp(18px, 5vw, 25px);
  font-weight: 900;
  line-height: 1.05;
  margin: 0;
  flex: 0 0 auto;
}

.progress small {
  font-size: 10px;
  color: #ffe58a;
}

.stage-wrap {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.stage {
  position: relative;
  width: min(100%, 43svh);
  max-width: 100%;
  max-height: 100%;
  aspect-ratio: 1 / 1;
  border: 3px solid var(--gold);
  border-radius: 11px;
  overflow: hidden;
  background: #17264b;
  box-shadow: 0 0 14px #f8c84a66;
  flex: 0 1 auto;
}

.photo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.grid {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  grid-template-rows: repeat(7, 1fr);
  gap: 1px;
  padding: 1px;
}

.tile {
  min-width: 0;
  min-height: 0;
  border: 1px solid #fff3a0;
  border-radius: 3px;
  background: linear-gradient(
    145deg,
    #ffe887,
    #e7a91c 55%,
    #a95c08
  );
  box-shadow: inset 0 0 4px #fff8;
  display: grid;
  place-items: center;
  color: #fff8b0;
  font-size: clamp(8px, 2.35vw, 12px);
  line-height: 1.05;
  font-weight: 900;
  text-shadow: 0 1px 2px #995500;
  touch-action: manipulation;
  padding: 1px;
  white-space: nowrap;
  letter-spacing: -.5px;
}

.tile.open {
  opacity: 0;
  pointer-events: none;
}

.hint {
  text-align: center;
  font-weight: 800;
  color: #fff2bd;
  font-size: clamp(10px, 2.8vw, 13px);
  line-height: 1.1;
  margin: 0;
  flex: 0 0 auto;
}

.panel {
  background: #14264c;
  border: 1px solid #6783bb;
  border-radius: 11px;
  padding: 7px;
  margin: 0;
  flex: 0 0 auto;
}

.panel h2 {
  font-size: 12px;
  margin: 0 0 5px;
  color: #ffdf72;
  line-height: 1.1;
}

.buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5px;
}

.btn {
  border: 0;
  border-radius: 8px;
  padding: 8px 4px;
  font-size: clamp(11px, 3vw, 14px);
  line-height: 1.1;
  font-weight: 900;
  color: #17203d;
  background: linear-gradient(#ffe58b, #e5a72b);
  touch-action: manipulation;
  min-height: 34px;
}

.btn.secondary {
  background: #f5f7ff;
  color: #18264b;
}

.btn.danger {
  background: #ff7b9e;
  color: #3b1020;
}

.btn:active {
  transform: scale(.98);
}

.upload-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.upload-label {
  font-size: 11px;
  color: #dbe5ff;
  line-height: 1.2;
  flex: 1;
  margin: 0;
}

input[type=file] {
  width: 58%;
  min-width: 0;
  font-size: 11px;
  color: #fff;
}

.status {
  text-align: center;
  font-size: 11px;
  color: #cbd8f5;
  margin-top: 4px;
  line-height: 1.1;
}

.note {
  font-size: 10px;
  color: #c5d2ef;
  line-height: 1.25;
  margin: 0;
  text-align: center;
  flex: 0 0 auto;
}

@media (max-height: 700px) {
  main {
    gap: 3px;
  }

  .title {
    font-size: clamp(18px, 5vw, 25px);
  }

  .progress {
    padding: 3px 5px;
  }

  .panel {
    padding: 5px;
  }

  .btn {
    min-height: 30px;
    padding: 6px 3px;
  }

  .stage {
    width: min(100%, 39svh);
  }
}

@media (orientation: landscape) {
  main {
    max-width: 900px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(230px, .8fr);
    grid-template-rows: auto auto auto 1fr auto;
    column-gap: 10px;
    row-gap: 4px;
  }

  .title, .sub, .progress, .hint {
    grid-column: 1;
  }

  .stage-wrap {
    grid-column: 1;
    grid-row: 4;
  }

  .stage {
    width: min(100%, 65svh);
  }

  .panel:nth-of-type(1) {
    grid-column: 2;
    grid-row: 1 / 4;
    align-self: end;
  }

  .panel:nth-of-type(2) {
    grid-column: 2;
    grid-row: 4;
    align-self: end;
  }

  .note {
    grid-column: 2;
    grid-row: 5;
  }
}
</style>
</head>

<body>
<main>

  <div class="title">
    誕生月×血液型
  </div>

  <div class="sub">
    ⭐ ギフトスター1個で1マスOPEN！ ⭐
  </div>

  <div class="progress">
    <span id="count">0</span> / 49 OPEN
    <br>
    <small>自分に当てはまるマスを見つけてね！</small>
  </div>

  <div class="stage-wrap">
    <div class="stage" id="stage">

      <img
        class="photo"
        id="photo"
        alt="出題する写真"
      >

      <div class="grid" id="grid"></div>

    </div>
  </div>

  <div class="hint">
    当てはまる誕生月×血液型をチェック！
  </div>

  <section class="panel">

    <h2>📱 配信中の操作</h2>

    <div class="buttons">

      <button class="btn" id="next" type="button">
        ⭐ 次の1マスをOPEN
      </button>

      <button class="btn secondary" id="undo" type="button">
        ↩ 1マス戻す
      </button>

      <button class="btn danger" id="reset" type="button">
        ⟲ 全49マスを隠す
      </button>

      <button class="btn secondary" id="shuffle" type="button">
        🔀 ランダムに1マスOPEN
      </button>

    </div>

    <div class="status" id="status">
      準備OK・写真を選んでスタート！
    </div>

  </section>

  <section class="panel">

    <h2>🖼️ 出題する写真</h2>

    <div class="upload-row">

      <label class="upload-label" for="upload">
        iPhoneの写真から選択
      </label>

      <input
        id="upload"
        type="file"
        accept="image/*"
      >

    </div>

  </section>

  <p class="note">
    ※手動操作版です。ギフトスターの自動検知には別途イベント連携が必要です。
  </p>

</main>

<script>
const grid = document.getElementById('grid');
const count = document.getElementById('count');
const status = document.getElementById('status');

let opened = [];
const tiles = [];

// 12か月×4種類の血液型＝48種類
const months = Array.from(
  { length: 12 },
  (_, i) => `${i + 1}月`
);

const bloodTypes = [
  'A型',
  'B型',
  'O型',
  'AB型'
];

// 49マス分の名称を作成
const labels = months.flatMap(month =>
  bloodTypes.map(type => `${month}${type}`)
);

// 49マス目
labels.push('その他');

// 49マスを作成
for (let i = 0; i < 49; i++) {

  const b = document.createElement('button');

  b.className = 'tile';
  b.type = 'button';
  b.textContent = labels[i];

  b.setAttribute(
    'aria-label',
    `${labels[i]}のマスを開く`
  );

  b.addEventListener('click', () => {
    openTile(i);
  });

  grid.appendChild(b);
  tiles.push(b);

}

// 画面更新
function update() {

  count.textContent = opened.length;

  if (opened.length === 49) {

    status.textContent =
      '全49マスOPEN！正解発表！';

  } else {

    status.textContent =
      `${opened.length}マスOPEN・残り${49 - opened.length}マス`;

  }

}

// 指定したマスを開く
function openTile(i) {

  if (opened.includes(i)) return;

  opened.push(i);

  tiles[i].classList.add('open');

  update();

}

// 次のマスを開く
function openNext(random = false) {

  const left = tiles
    .map((_, i) => i)
    .filter(i => !opened.includes(i));

  if (!left.length) return;

  const i = random
    ? left[Math.floor(Math.random() * left.length)]
    : left[0];

  openTile(i);

}

// 次の1マス
document.getElementById('next').onclick = () => {
  openNext(false);
};

// ランダムOPEN
document.getElementById('shuffle').onclick = () => {
  openNext(true);
};

// 1マス戻す
document.getElementById('undo').onclick = () => {

  const i = opened.pop();

  if (i !== undefined) {
    tiles[i].classList.remove('open');
  }

  update();

};

// 全マスリセット
document.getElementById('reset').onclick = () => {

  opened = [];

  tiles.forEach(t => {
    t.classList.remove('open');
  });

  update();

};

// 写真を選択
document.getElementById('upload').onchange = e => {

  const f = e.target.files && e.target.files[0];

  if (!f) return;

  const url = URL.createObjectURL(f);

  document.getElementById('photo').src = url;

  opened = [];

  tiles.forEach(t => {
    t.classList.remove('open');
  });

  update();

  status.textContent =
    '写真をセットしました！配信を始められます。';

};

update();
</script>

</body>
</html>
